

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Consent</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080808;color:white;
  font-family:Arial,sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px
}
.card{
  width:100%;max-width:430px;background:#151515;
  border:1px solid #b8944b;border-radius:18px;
  padding:25px;text-align:center
}
h1{color:#d5b36a}
p{color:#ccc;line-height:1.6}
video,img{width:100%;border-radius:12px;margin-top:15px}
button{
  width:100%;padding:15px;margin-top:15px;
  background:#c6a15b;color:#080808;border:0;
  border-radius:9px;font-weight:bold;font-size:16px;
  cursor:pointer
}
button:disabled{opacity:.5}
label{display:flex;gap:10px;text-align:left;
margin-top:18px;color:#ddd;line-height:1.5}
input{width:20px;height:20px;flex-shrink:0}
#status{margin-top:15px;color:#e3c47f}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Photo Consent</h1>
  <p>
    This website allows you to take a photo using your camera.
    If you continue, you can preview your photo and choose
    whether to email it to aland.qaes355@gmail.com.
    Nothing is sent without your final confirmation.
  </p>

  <button id="start">Allow Camera</button>

  <video id="video" autoplay playsinline class="hidden"></video>

  <button id="take" class="hidden">Take Photo</button>

  <canvas id="canvas" class="hidden"></canvas>
  <img id="preview" class="hidden" alt="Photo preview">

  <div id="sendArea" class="hidden">
    <label>
      <input type="checkbox" id="consent">
      I agree to send this photo to
      aland.qaes355@gmail.com.
    </label>
    <button id="send" disabled>Send Photo</button>
  </div>

  <button id="retake" class="hidden">Retake Photo</button>
  <div id="status"></div>
</div>

<script>
const SERVICE_ID = "service_r370oq4";
const TEMPLATE_ID = "template_5dlf3ba";
const PUBLIC_KEY = "Zkrko9SLwUVuvGkbu";

emailjs.init({publicKey: PUBLIC_KEY});

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const start = document.getElementById("start");
const take = document.getElementById("take");
const send = document.getElementById("send");
const consent = document.getElementById("consent");
const sendArea = document.getElementById("sendArea");
const retake = document.getElementById("retake");

let stream = null;
let photoData = null;

start.onclick = async () => {
  try {
    status.textContent = "Waiting for camera permission...";

    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: "user"},
      audio: false
    });

    video.srcObject = stream;
    video.classList.remove("hidden");
    take.classList.remove("hidden");
    start.classList.add("hidden");
    status.textContent = "Camera ready.";
  } catch (error) {
    status.textContent =
      "Camera unavailable. Please allow camera access and try again.";
  }
};

take.onclick = () => {
  const width = Math.min(video.videoWidth, 1280);
  const height = video.videoHeight * width / video.videoWidth;

  canvas.width = width;
  canvas.height = height;

  canvas.getContext("2d").drawImage(video, 0, 0, width, height);

  photoData = canvas.toDataURL("image/jpeg", 0.75).split(",")[1];

  preview.src = "data:image/jpeg;base64," + photoData;
  preview.classList.remove("hidden");
  video.classList.add("hidden");
  take.classList.add("hidden");
  sendArea.classList.remove("hidden");
  retake.classList.remove("hidden");

  status.textContent = "Review your photo before sending.";
};

consent.onchange = () => {
  send.disabled = !consent.checked;
};

retake.onclick = () => {
  preview.classList.add("hidden");
  sendArea.classList.add("hidden");
  retake.classList.add("hidden");
  video.classList.remove("hidden");
  take.classList.remove("hidden");
  consent.checked = false;
  send.disabled = true;
  photoData = null;
  status.textContent = "Take another photo.";
};

send.onclick = async () => {
  if (!consent.checked || !photoData) return;

  send.disabled = true;
  retake.disabled = true;
  status.textContent = "Sending your photo...";

  try {
    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
      photo_data: photoData,
      photo_name: "camera-photo.jpg",
      message: "A visitor voluntarily submitted a photo."
    });

    status.textContent = "Photo sent successfully. Thank you!";
    sendArea.classList.add("hidden");
    retake.classList.add("hidden");

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
  } catch (error) {
    status.textContent = "Sending failed. Please try again.";
    send.disabled = false;
    retake.disabled = false;
  }
};
</script>
</body>
</html>
